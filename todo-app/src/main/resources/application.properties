# ============================================================================
#  Quarkus configuration for the Todo app
#  Docs: https://quarkus.io/guides/config-reference
# ============================================================================

# ----- HTTP -----------------------------------------------------------------
# The backend (and the bundled frontend) are served on port 8080.
quarkus.http.port=8090

# ----- Database (PostgreSQL) ------------------------------------------------
# Matches the credentials in docker-compose.yml. Start the DB with:
#   docker-compose up -d
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=todo
quarkus.datasource.password=todo
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tododb

# ----- Hibernate ORM --------------------------------------------------------
# drop-and-create wipes and recreates the schema on every startup. Great for
# development (you always get a clean DB), but NEVER use it in production.
quarkus.hibernate-orm.database.generation=drop-and-create
# Log the generated SQL so you can learn what Panache/Hibernate is doing.
quarkus.hibernate-orm.log.sql=true

# ----- CORS -----------------------------------------------------------------
# The frontend is served from the same origin (port 8080) so CORS isn't
# strictly required, but we enable it so you can also run the index.html from
# a different origin (e.g. http://localhost:5500 via Live Server) during dev.
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type
