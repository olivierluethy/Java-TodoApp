<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>

  <!-- Tailwind CSS via CDN — no build step needed for this learning project. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Small flourish: smoothly fade/strike completed items. */
    .todo-done span { text-decoration: line-through; }
  </style>
</head>

<!-- Dark slate background, centered content. -->
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center px-4 py-12">

  <main class="w-full max-w-[600px]">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold tracking-tight">Todo</h1>
      <p class="text-slate-400 text-sm mt-1">A tiny Quarkus + Panache demo</p>
    </header>

    <!-- ===== Add-todo form ===== -->
    <form id="add-form" class="flex gap-2 mb-6">
      <input
        id="title-input"
        type="text"
        placeholder="What needs doing?"
        autocomplete="off"
        class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5
               placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500
               focus:border-transparent transition" />
      <button
        id="add-btn"
        type="submit"
        class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50
               disabled:cursor-not-allowed px-5 py-2.5 rounded-lg font-medium transition">
        Add
      </button>
    </form>

    <!-- ===== Status / loading line ===== -->
    <p id="status" class="text-slate-500 text-sm h-5 mb-2"></p>

    <!-- ===== Todo list ===== -->
    <ul id="todo-list" class="space-y-2"></ul>

    <!-- ===== Empty state (hidden unless there are zero todos) ===== -->
    <div id="empty-state" class="hidden text-center py-16 text-slate-500">
      <div class="text-5xl mb-3">🌙</div>
      <p>Nothing here yet. Add your first todo above.</p>
    </div>
  </main>

  <script>
    // Relative URL: the frontend is served by the same Quarkus app that hosts
    // the API, so we call "/api/todos" on whatever origin this page loaded from.
    // This means it just works no matter which port the app runs on (8080, 8090,
    // …) and avoids CORS entirely, since it's always the same origin.
    const API = "/api/todos";

    // Cache DOM references once.
    const listEl   = document.getElementById("todo-list");
    const emptyEl  = document.getElementById("empty-state");
    const statusEl = document.getElementById("status");
    const formEl   = document.getElementById("add-form");
    const inputEl  = document.getElementById("title-input");
    const addBtn   = document.getElementById("add-btn");

    // Show a subtle, auto-clearing status/loading message.
    let statusTimer;
    function setStatus(text, sticky = false) {
      clearTimeout(statusTimer);
      statusEl.textContent = text;
      if (text && !sticky) {
        statusTimer = setTimeout(() => (statusEl.textContent = ""), 1200);
      }
    }

    // Escape user text so titles can't inject HTML.
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Build the <li> for a single todo.
    function renderTodo(todo) {
      const li = document.createElement("li");
      li.className =
        "group flex items-center gap-3 bg-slate-800 border border-slate-700 " +
        "rounded-lg px-4 py-3 transition" + (todo.completed ? " todo-done" : "");

      li.innerHTML = `
        <input type="checkbox" ${todo.completed ? "checked" : ""}
          class="h-5 w-5 shrink-0 cursor-pointer rounded border-slate-600
                 bg-slate-700 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-800" />
        <span class="flex-1 ${todo.completed ? "text-slate-500" : "text-slate-100"} break-words">
          ${escapeHtml(todo.title)}
        </span>
        <button title="Delete"
          class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400
                 transition p-1 rounded">
          <!-- trash icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      `;

      // Toggle complete on checkbox change.
      li.querySelector("input").addEventListener("change", () => toggleTodo(todo.id));
      // Delete on trash click.
      li.querySelector("button").addEventListener("click", () => deleteTodo(todo.id));

      return li;
    }

    // Paint the whole list (and show/hide the empty state).
    function render(todos) {
      listEl.innerHTML = "";
      if (todos.length === 0) {
        emptyEl.classList.remove("hidden");
        return;
      }
      emptyEl.classList.add("hidden");
      todos.forEach((t) => listEl.appendChild(renderTodo(t)));
    }

    // --- API calls -----------------------------------------------------------

    async function loadTodos() {
      setStatus("Loading…", true);
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
        setStatus("");
      } catch (err) {
        setStatus("Could not reach the API. Is the backend running?", true);
        console.error(err);
      }
    }

    async function addTodo(title) {
      addBtn.disabled = true;
      setStatus("Adding…", true);
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        inputEl.value = "";
        await loadTodos();
      } catch (err) {
        setStatus("Failed to add todo.", true);
        console.error(err);
      } finally {
        addBtn.disabled = false;
      }
    }

    async function toggleTodo(id) {
      setStatus("Updating…", true);
      try {
        const res = await fetch(`${API}/${id}`, { method: "PUT" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        await loadTodos();
      } catch (err) {
        setStatus("Failed to update todo.", true);
        console.error(err);
      }
    }

    async function deleteTodo(id) {
      setStatus("Deleting…", true);
      try {
        const res = await fetch(`${API}/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        await loadTodos();
      } catch (err) {
        setStatus("Failed to delete todo.", true);
        console.error(err);
      }
    }

    // --- Wire up the form ----------------------------------------------------

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = inputEl.value.trim();
      if (!title) return; // input validation: ignore empty titles
      addTodo(title);
    });

    // Initial load.
    loadTodos();
  </script>
</body>
</html>
